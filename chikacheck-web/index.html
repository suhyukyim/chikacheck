<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>치카체크</title>
  <meta name="description" content="어린이 정량 치약 디스펜서 「치카체크」와 함께 쓰는 양치 기록 웹 — 발표용 시연 프로토타입">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="치카체크">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="phone">
      <header class="topbar">
        <h1 class="topbar-title" id="screen-title">치카체크</h1>
        <div class="topbar-side">
          <span class="pill" id="screen-badge" hidden></span>
          <button type="button" class="profile-btn" id="profile-btn" hidden>
            <span class="sr-only">프로필 바꾸기, 지금 프로필:</span>
            <span id="profile-name"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
          </button>
        </div>
      </header>
      <div id="banner-slot"></div>
      <main id="view"></main>
      <nav class="tabbar" aria-label="화면 이동">
        <button type="button" class="tab" data-path="/timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M10 2.5h4M12 2.5V6"/></svg>
          <span>치카 타임</span>
        </button>
        <button type="button" class="tab" data-path="/friend">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 9.3C7.9 6.8 7.6 3.9 8.8 3.1c1.3-.8 2.5 1.9 2.6 5.1M14.8 9.3c1.3-2.5 1.6-5.4.4-6.2-1.3-.8-2.5 1.9-2.6 5.1"/><circle cx="12" cy="15" r="6.5"/><path d="M10 14.5h.01M14 14.5h.01M10.8 17.3c.7.5 1.7.5 2.4 0"/></svg>
          <span>내 친구</span>
        </button>
        <button type="button" class="tab" data-path="/parent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
          <span>부모</span>
        </button>
      </nav>
    </div>
    <aside id="device-slot" aria-label="가상 본체"></aside>
  </div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">자바스크립트를 켜야 치카체크를 쓸 수 있어요.</p></noscript>
</body>
</html>
