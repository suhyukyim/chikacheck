<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>치카체크 테스트</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { padding: var(--s6) var(--s5); }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: var(--fs-title); font-weight: 800; }
    #summary { margin: var(--s3) 0 var(--s5); font-size: 18px; font-weight: 800; }
    #summary.is-pass { color: var(--green-ink); }
    #summary.is-fail { color: var(--danger-ink); }
    #results { margin: 0; padding: 0; list-style: none; }
    #results li { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); font-size: 14px; }
    .tag { display: inline-block; min-width: 44px; margin-right: var(--s2); font-weight: 800; }
    .pass .tag { color: var(--green-ink); }
    .fail { background: var(--danger-soft); }
    .fail .tag { color: var(--danger-ink); }
    .detail { margin: var(--s1) 0 0 52px; color: var(--danger-ink); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
    .count { color: var(--ink-sub); font-size: 12px; }
  </style>
  <script type="module" src="js/tests/run.js"></script>
</head>
<body>
  <main>
    <h1>치카체크 단위 테스트</h1>
    <p id="summary">실행 중…</p>
    <ul id="results"></ul>
  </main>
</body>
</html>
